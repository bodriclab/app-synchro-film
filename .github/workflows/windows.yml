name: Windows build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the Windows build to (e.g. v0.5.0)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _ci
          sparse-checkout: windows/installer
      - name: Use installer script from main
        shell: pwsh
        run: New-Item -ItemType Directory -Force windows\installer | Out-Null; Copy-Item _ci\windows\installer\* windows\installer\ -Force
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath SynchroFilm-windows-x64.zip
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $ver = $tag.TrimStart('v')
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$ver" windows\installer\synchrofilm.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "dist\SynchroFilm-Setup-$ver.exe" "SynchroFilm-Setup-windows-x64.exe"
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" SynchroFilm-Setup-windows-x64.exe SynchroFilm-windows-x64.zip --clobber

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Synchro Film</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="stage">
  <video id="video" playsinline preload="auto"></video>
  <button id="unlock" hidden>▶ Toucher pour démarrer</button>
  <div id="message" hidden></div>
</div>
<div id="bar">
  <div id="status">Connexion…</div>
  <div id="controls">
    <button id="back" title="-10 s">⟲ 10</button>
    <button id="play" title="Lecture / pause">▶</button>
    <button id="fwd" title="+10 s">10 ⟳</button>
    <span id="time">00:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="duration">--:--</span>
    <button id="full" title="Plein écran">⛶</button>
    <a id="download" title="Télécharger le film sur cet appareil" hidden>⬇</a>
  </div>
  <div id="local">
    <button id="pickLocal" title="Lire une copie du film déjà présente sur cet appareil (sans streaming)">📂 Utiliser un fichier local</button>
    <input id="localFile" type="file" accept="video/*" hidden>
    <button id="backStream" hidden>↩ Revenir au stream</button>
    <a id="iosCopy" class="btn" hidden title="Copie MP4 lisible sur iPhone/iPad, à ouvrir ensuite avec « Utiliser un fichier local »">📱 Télécharger copie compatible iOS</a>
    <span id="iosState" hidden></span>
  </div>
</div>
<script src="clock.js"></script>
<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Synchro Film — son</title>
<link rel="stylesheet" href="audio.css">
</head>
<body>
<main>
  <h1 id="title">App Synchro Film</h1>
  <p id="conn" class="pill">Connexion…</p>
  <button id="unlock" class="big">🔊 Activer le son</button>
  <section id="player">
    <div id="state">Pause</div>
    <div id="time"><span id="pos">00:00</span> / <span id="dur">--:--</span></div>
    <div id="controls">
      <button id="back" title="-10 s">⟲ 10</button>
      <button id="play" title="Lecture / pause">▶</button>
      <button id="fwd" title="+10 s">10 ⟳</button>
    </div>
  </section>
  <section id="offset">
    <label for="slider">Décalage du son (écouteurs Bluetooth) : <b id="offsetValue">0 ms</b></label>
    <input id="slider" type="range" min="-500" max="500" step="10" value="0">
    <div class="hint"><span>← son en retard</span><button id="reset">0</button><span>son en avance →</span></div>
    <p id="latency" class="hint"></p>
  </section>
  <section id="volume">
    <label for="gain">Volume de cet appareil : <b id="gainValue">100 %</b></label>
    <input id="gain" type="range" min="0.5" max="3" step="0.1" value="1">
    <p class="hint">Au-delà de 100 %, le son est amplifié sans saturer.</p>
  </section>
  <p id="message" hidden></p>
</main>
<script src="clock.js"></script>
<script src="audio.js"></script>
</body>
</html>
